# Node and dependencies for every job of pr.yml and production.yml.
# A local action is read from the checked-out repo, so each job runs
# `actions/checkout` itself first, then `uses: ./.github/actions/setup`.
name: Setup
description: Set up Node (with the npm cache) and install dependencies with npm ci.

inputs:
  node-version:
    description: Node.js version
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: npm ci
      shell: bash
