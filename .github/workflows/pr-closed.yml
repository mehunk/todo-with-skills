# Tears down a closed (or merged) PR's preview database. See README "CI on
# pull requests".
#
# A workflow of its own, not a `closed` trigger in pr.yml: there the
# `PR pipeline` gate runs on `always()` and would run (and fail) on close. This
# workflow has a single job, so a close never runs or reports `Checks`,
# `Preview deploy`, `E2E` or `PR pipeline`.
name: PR closed

on:
  pull_request:
    types: [closed]

# The same group as pr.yml, so teardown never runs alongside a deploy of the
# same PR: closing cancels the PR's in-flight run (its deploy is moot), and
# teardown starts once that run has stopped. Reopening starts a new pr.yml run,
# which cancels a teardown still waiting or running; its deploy then reuses
# the database or creates a fresh one.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secrets only reach PRs from branches of this repository, never forks.
  teardown-preview:
    name: Preview teardown
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    steps:
      # The base branch's code, not the PR's: the PR's merge ref may no longer
      # exist once it is closed, and the base has the teardown script once this
      # workflow has landed there.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: ./.github/actions/setup
      - name: Delete the PR's D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALIAS: pr-${{ github.event.pull_request.number }}
        run: npm run -s preview:teardown -- "$ALIAS"
