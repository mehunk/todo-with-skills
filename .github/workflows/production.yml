# Production release: merging to main is releasing. Static checks, then
# migrate the production D1 and deploy the `todo` Worker, then the smoke E2E
# against the production URL. See README "Releasing to production".
name: Production

on:
  push:
    branches: [main]

# One production deploy at a time. A running release is never cancelled
# midway (it may be between migrating and deploying); a newer push waits.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Format and lint
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  deploy:
    name: Production deploy
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Build, migrate the `todo` D1, then deploy; a failed migration stops
      # the job before `wrangler deploy` runs.
      - name: Migrate production D1 and deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
        run: |
          url=$(npm run -s production:deploy)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke E2E
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the smoke E2E against production
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: npm run e2e -- e2e/smoke.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
